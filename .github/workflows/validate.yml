# Managed by ngx-workshop CLI. Policy v1; edit the central CLI profile, then run workflows --apply.
name: "Validate seed-service-nestjs"
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: "read"
jobs:
  validate:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - name: "Setup Node 22"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "22.23.5"
          check-latest: true
          package-manager-cache: false
      - name: "Generate OpenAPI spec"
        env:
          GENERATE_OPENAPI: "true"
        run: |
          npm ci
          npm run format:check
          npm run lint:check
          GENERATE_OPENAPI=false npm test -- --runInBand
          npm run test:e2e -- --runInBand
          npm run build
          npm run openapi
      - name: "Build contracts"
        working-directory: "contracts/seed-service-nestjs"
        run: |
          npm ci
          npm run gen
          npm run build
      - name: "Upload OpenAPI artifact"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        with:
          name: "seed-service-nestjs-openapi"
          path: "openapi.json"
          if-no-files-found: "error"
    env:
      HUSKY: "0"
